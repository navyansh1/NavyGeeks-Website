name: Daily health check

on:
  schedule:
    - cron: '30 3 * * *' # every day, 03:30 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Report outdated dependencies
        run: npm outdated || true
