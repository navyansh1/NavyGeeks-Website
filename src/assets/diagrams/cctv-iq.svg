<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
  <rect width="1280" height="720" fill="#162121"/>
  <text x="48" y="64" font-size="30" font-weight="bold" fill="#E5E7EB">CCTV IQ: Face ID Attendance</text>
  <text x="48" y="94" font-size="16" fill="#9CA3AF">Two doorway cameras, one attendance record per person per day</text>
  
    <rect x="48" y="140" width="200" height="118" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="64" y="168" font-size="17" font-weight="bold" fill="#E5E7EB">Doorway cameras</text><text x="64" y="192" font-size="15" fill="#9CA3AF">entry cam: inside,</text><text x="64" y="212" font-size="15" fill="#9CA3AF">looking out</text><text x="64" y="232" font-size="15" fill="#9CA3AF">lobby cam: looking in</text>
    <line x1="248" y1="199" x2="284" y2="199" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="286" y="140" width="200" height="118" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="302" y="168" font-size="17" font-weight="bold" fill="#E5E7EB">Capture threads</text><text x="302" y="192" font-size="15" fill="#9CA3AF">one per camera</text><text x="302" y="212" font-size="15" fill="#9CA3AF">stall watchdog</text><text x="302" y="232" font-size="15" fill="#9CA3AF">auto camera reboot</text>
    <line x1="486" y1="199" x2="522" y2="199" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="524" y="140" width="200" height="118" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="540" y="168" font-size="17" font-weight="bold" fill="#E5E7EB">Ignore zones</text><text x="540" y="192" font-size="15" fill="#9CA3AF">desks and the clear</text><text x="540" y="212" font-size="15" fill="#9CA3AF">glass strip masked</text><text x="540" y="232" font-size="15" fill="#9CA3AF">before any AI runs</text>
    <line x1="724" y1="199" x2="760" y2="199" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="762" y="140" width="220" height="118" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="778" y="168" font-size="17" font-weight="bold" fill="#EAB308">Detect + embed</text><text x="778" y="192" font-size="15" fill="#9CA3AF">SCRFD + antelopev2</text><text x="778" y="212" font-size="15" fill="#9CA3AF">both on the Intel iGPU</text><text x="778" y="232" font-size="15" fill="#9CA3AF">(OpenVINO)</text>
    <line x1="982" y1="199" x2="1018" y2="199" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1020" y="140" width="212" height="118" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="1036" y="168" font-size="17" font-weight="bold" fill="#EAB308">Gallery match</text><text x="1036" y="192" font-size="15" fill="#9CA3AF">182 people</text><text x="1036" y="212" font-size="15" fill="#9CA3AF">score floor 0.41</text><text x="1036" y="232" font-size="15" fill="#9CA3AF">runner-up margin</text>
    <line x1="1126" y1="258" x2="1126" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="860" y="302" width="372" height="124" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="876" y="330" font-size="17" font-weight="bold" fill="#EAB308">Attendance logic</text><text x="876" y="354" font-size="15" fill="#9CA3AF">clock in = first sighting, either camera</text><text x="876" y="374" font-size="15" fill="#9CA3AF">clock out = last sighting, either camera</text><text x="876" y="394" font-size="15" fill="#9CA3AF">time inside = span minus breaks seen</text>
    <line x1="860" y1="364" x2="808" y2="364" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="560" y="302" width="246" height="124" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="576" y="330" font-size="17" font-weight="bold" fill="#E5E7EB">Storage</text><text x="576" y="354" font-size="15" fill="#9CA3AF">SQLite on local disk</text><text x="576" y="374" font-size="15" fill="#9CA3AF">face photo at every</text><text x="576" y="394" font-size="15" fill="#9CA3AF">clock-in and clock-out</text>
    <line x1="560" y1="364" x2="508" y2="364" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="48" y="302" width="458" height="124" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="64" y="330" font-size="17" font-weight="bold" fill="#E5E7EB">Outputs</text><text x="64" y="354" font-size="15" fill="#9CA3AF">live dashboard + one Excel file per day</text><text x="64" y="374" font-size="15" fill="#9CA3AF">Ask Iris: plain-English questions; Claude</text><text x="64" y="394" font-size="15" fill="#9CA3AF">Haiku 4.5 on Bedrock writes one SQL query</text>
    <text x="48" y="480" font-size="13" fill="#EAB308" font-weight="bold" letter-spacing="1">WHAT THE MEASUREMENTS SHOWED</text>
    <rect x="48" y="496" width="370" height="136" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="64" y="524" font-size="17" font-weight="bold" fill="#E5E7EB">9.86 → 0.31 s per frame</text><text x="64" y="548" font-size="15" fill="#9CA3AF">both models moved from the CPU</text><text x="64" y="568" font-size="15" fill="#9CA3AF">to the idle Intel iGPU,</text><text x="64" y="588" font-size="15" fill="#9CA3AF">with identical scores</text>
    <rect x="442" y="496" width="370" height="136" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="458" y="524" font-size="17" font-weight="bold" fill="#E5E7EB">Threshold from real data</text><text x="458" y="548" font-size="15" fill="#9CA3AF">a day checked by hand: 0.41</text><text x="458" y="568" font-size="15" fill="#9CA3AF">removed all 24 false rows</text><text x="458" y="588" font-size="15" fill="#9CA3AF">and lost no real person</text>
    <rect x="836" y="496" width="396" height="136" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="852" y="524" font-size="17" font-weight="bold" fill="#E5E7EB">Built to keep running</text><text x="852" y="548" font-size="15" fill="#9CA3AF">a supervisor restarts it in ~15 s</text><text x="852" y="568" font-size="15" fill="#9CA3AF">switching the cameras to H.264</text><text x="852" y="588" font-size="15" fill="#9CA3AF">fixed 60-73% broken frames</text>
  </svg>