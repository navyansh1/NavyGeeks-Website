<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
  <rect width="1280" height="720" fill="#162121"/>
  <text x="48" y="64" font-size="30" font-weight="bold" fill="#E5E7EB">GeoScout IQ</text>
  <text x="48" y="94" font-size="16" fill="#9CA3AF">Where to open the next ATM, branch, store or warehouse in India</text>
  
    <rect x="48" y="150" width="250" height="130" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="64" y="178" font-size="17" font-weight="bold" fill="#E5E7EB">Ask</text><text x="64" y="202" font-size="15" fill="#9CA3AF">any Indian location</text><text x="64" y="222" font-size="15" fill="#9CA3AF">industry and use case</text><text x="64" y="242" font-size="15" fill="#9CA3AF">your company (optional)</text>
    <line x1="298" y1="215" x2="346" y2="215" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="348" y="150" width="300" height="300" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="364" y="178" font-size="17" font-weight="bold" fill="#E5E7EB">Data sources</text><text x="364" y="202" font-size="15" fill="#9CA3AF">Google Places: competitors</text><text x="364" y="222" font-size="15" fill="#9CA3AF">WorldPop: population</text><text x="364" y="242" font-size="15" fill="#9CA3AF">NASA night lights: activity</text><text x="364" y="262" font-size="15" fill="#9CA3AF">OpenStreetMap: malls, transit,</text><text x="364" y="282" font-size="15" fill="#9CA3AF">  schools, land you cannot use</text><text x="364" y="302" font-size="15" fill="#9CA3AF">Property listings: rents</text><text x="364" y="322" font-size="15" fill="#9CA3AF">Google Search: upcoming</text><text x="364" y="342" font-size="15" fill="#9CA3AF">  metro, roads and projects</text>
    <line x1="648" y1="300" x2="696" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="698" y="150" width="270" height="140" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="714" y="178" font-size="17" font-weight="bold" fill="#EAB308">H3 hex grid</text><text x="714" y="202" font-size="15" fill="#9CA3AF">~0.7 sq km tiles</text><text x="714" y="222" font-size="15" fill="#9CA3AF">demand · open space ·</text><text x="714" y="242" font-size="15" fill="#9CA3AF">access · growth</text>
    <line x1="833" y1="290" x2="833" y2="320" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="698" y="322" width="270" height="128" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="714" y="350" font-size="17" font-weight="bold" fill="#EAB308">Gemini grounding agents</text><text x="714" y="374" font-size="15" fill="#9CA3AF">nearby context and the</text><text x="714" y="394" font-size="15" fill="#9CA3AF">written narrative</text>
    <line x1="968" y1="300" x2="1016" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1018" y="150" width="214" height="300" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="1034" y="178" font-size="17" font-weight="bold" fill="#E5E7EB">Answer in ~30 s</text><text x="1034" y="202" font-size="15" fill="#9CA3AF">colour-coded hex</text><text x="1034" y="222" font-size="15" fill="#9CA3AF">heatmap</text><text x="1034" y="242" font-size="15" fill="#9CA3AF">competitor and own</text><text x="1034" y="262" font-size="15" fill="#9CA3AF">store pins</text><text x="1034" y="282" font-size="15" fill="#9CA3AF">property listings</text><text x="1034" y="302" font-size="15" fill="#9CA3AF">executive summary:</text><text x="1034" y="322" font-size="15" fill="#9CA3AF">GO / CAUTION / AVOID</text>
    <text x="48" y="520" font-size="13" fill="#EAB308" font-weight="bold" letter-spacing="1">BUILT FOR</text>
    <text x="48" y="548" font-size="16" fill="#E5E7EB">BFSI (ATM and branch placement) and FMCG (stores and warehouses). Same input gives the same score, and the scoring maths is visible.</text>
    <text x="48" y="610" font-size="13" fill="#EAB308" font-weight="bold" letter-spacing="1">STACK</text>
    <text x="48" y="638" font-size="16" fill="#E5E7EB">Google Maps · H3 · Gemini · Firebase (Hosting, Functions, Firestore)</text>
  </svg>