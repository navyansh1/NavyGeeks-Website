<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/></marker></defs>
  <rect width="1280" height="720" fill="#162121"/>
  <text x="48" y="64" font-size="30" font-weight="bold" fill="#E5E7EB">Selective Embedding Update for RAG</text>
  <text x="48" y="94" font-size="16" fill="#9CA3AF">Replace only the changed document, never the whole index</text>
  
    <rect x="48" y="150" width="200" height="110" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="64" y="178" font-size="17" font-weight="bold" fill="#E5E7EB">Upload PDF</text><text x="64" y="202" font-size="15" fill="#9CA3AF">Streamlit UI</text>
    <line x1="248" y1="205" x2="286" y2="205" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="288" y="150" width="220" height="110" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="304" y="178" font-size="17" font-weight="bold" fill="#EAB308">Already in S3?</text><text x="304" y="202" font-size="15" fill="#9CA3AF">one HEAD request</text><text x="304" y="222" font-size="15" fill="#9CA3AF">O(1) check</text>
    <line x1="508" y1="205" x2="546" y2="205" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <text x="512" y="190" font-size="12" fill="#9CA3AF" font-weight="normal" letter-spacing="1">yes</text>
    <rect x="548" y="150" width="220" height="110" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="564" y="178" font-size="17" font-weight="bold" fill="#EAB308">Delete old chunks</text><text x="564" y="202" font-size="15" fill="#9CA3AF">1 delete-by-query</text><text x="564" y="222" font-size="15" fill="#9CA3AF">instead of 250</text>
    <line x1="398" y1="260" x2="398" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <text x="408" y="288" font-size="12" fill="#9CA3AF" font-weight="normal" letter-spacing="1">no: new file</text>
    <line x1="768" y1="205" x2="806" y2="205" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="808" y="150" width="200" height="110" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="824" y="178" font-size="17" font-weight="bold" fill="#E5E7EB">Save to S3</text><text x="824" y="202" font-size="15" fill="#9CA3AF">versioned,</text><text x="824" y="222" font-size="15" fill="#9CA3AF">so it can roll back</text>
    <line x1="1008" y1="205" x2="1030" y2="205" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="1032" y="150" width="200" height="110" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="1048" y="178" font-size="17" font-weight="bold" fill="#E5E7EB">Extract + chunk</text><text x="1048" y="202" font-size="15" fill="#9CA3AF">PyPDF</text><text x="1048" y="222" font-size="15" fill="#9CA3AF">1000 / 200</text>
    <line x1="1132" y1="260" x2="1132" y2="300" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="288" y="302" width="220" height="100" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="304" y="330" font-size="17" font-weight="bold" fill="#E5E7EB">Process new</text><text x="304" y="354" font-size="15" fill="#9CA3AF">same steps, no delete</text>
    <rect x="912" y="302" width="320" height="100" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="928" y="330" font-size="17" font-weight="bold" fill="#E5E7EB">Titan embeddings</text><text x="928" y="354" font-size="15" fill="#9CA3AF">Bedrock, 1536-dim, batched</text>
    <line x1="912" y1="352" x2="830" y2="352" stroke="#9CA3AF" stroke-width="2" marker-end="url(#a)"/>
    <rect x="548" y="302" width="280" height="100" rx="12" fill="#3A3314" stroke="#EAB308" stroke-width="2"/>
  <text x="564" y="330" font-size="17" font-weight="bold" fill="#EAB308">OpenSearch</text><text x="564" y="354" font-size="15" fill="#9CA3AF">kNN (HNSW), 1 bulk insert</text>
    <text x="48" y="440" font-size="13" fill="#9CA3AF" font-weight="normal" letter-spacing="1">QUESTIONS KEEP WORKING DURING AN UPDATE</text>
    <text x="48" y="468" font-size="16" fill="#E5E7EB">question → Titan embedding → kNN search in OpenSearch → Claude 3 Haiku on Bedrock → answer</text>
    <text x="48" y="510" font-size="13" fill="#EAB308" font-weight="bold" letter-spacing="1">RESULTS (50 PDFs, 5-150 PAGES)</text>
    <rect x="48" y="526" width="370" height="140" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="64" y="554" font-size="17" font-weight="bold" fill="#E5E7EB">84.9% faster updates</text><text x="64" y="578" font-size="15" fill="#9CA3AF">150 pages: 625.8 s → 94.3 s</text>
    <rect x="442" y="526" width="370" height="140" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="458" y="554" font-size="17" font-weight="bold" fill="#E5E7EB">99.6% fewer calls</text><text x="458" y="578" font-size="15" fill="#9CA3AF">500 requests → 2</text>
    <rect x="836" y="526" width="396" height="140" rx="12" fill="#213130" stroke="#3E5654" stroke-width="1.5"/>
  <text x="852" y="554" font-size="17" font-weight="bold" fill="#E5E7EB">Same answer quality</text><text x="852" y="578" font-size="15" fill="#9CA3AF">Recall@5 0.87, Precision@5 0.82</text><text x="852" y="598" font-size="15" fill="#9CA3AF">~40% less memory</text>
  </svg>